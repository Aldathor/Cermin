name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: CLI help
        run: cargo run --locked -p rotten-app --bin cermin-cli -- --help

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native Windows tests (source encoder)
        run: cargo test --locked --workspace --all-targets --features rotten-app/gui
      - name: Build Windows GUI and DLL encoder
        run: cargo build --locked -p rotten-app --no-default-features --features encode-dll,gui --bins
      - name: CLI help
        run: .\target\debug\cermin-cli.exe --help
      - name: CLI startup probe (no receiver required)
        run: .\target\debug\cermin-cli.exe probe
      - name: Check combined encoder features
        run: cargo check --locked -p rotten-app --all-targets --all-features

  cross-compile-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 bzip2
      - name: Cross-compile Windows binary
        run: bash ./scripts/build-windows.sh
